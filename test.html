<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Reisekarte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;background:#f8f9fa;}
  #map{height:100vh;width:100vw;}
  .legend{background:white;padding:8px;border-radius:6px;font-size:13px;line-height:1.4;}
  .legend div{margin-bottom:4px;}
</style>
</head>
<body>
<div id="map"></div>

<script>
// --- Besuchsdaten ---
const countryVisits = {
  "Deutschland": 999,
  "Spanien": 5,
  "Frankreich": 4,
  "Niederlande": 4,
  "Schweiz": 3,
  "Griechenland": 3,
  "Italien": 3,
  "Türkei": 3,
  "England": 3,
  "Schweden": 3,
  "Vatikan": 2,
  "Vereinigte Arabische Emirate": 2,
  "Dänemark": 2,
  "Luxemburg": 1,
  "Österreich": 1,
  "Belgien": 1,
  "Malta": 1,
  "Gibraltar": 1,
  "Marokko": 1,
  "Ungarn": 1,
  "Portugal": 1,
  "Norwegen": 1,
  "Litauen": 1,
  "USA": 1,
  "Slowakei": 1,
  "Mauritius": 1,
  "Lettland": 1
};

// --- Mapping deutsch → englisch (GeoJSON-ADMIN-Namen) ---
const nameMap = {
  "Deutschland": "Germany",
  "Spanien": "Spain",
  "Frankreich": "France",
  "Niederlande": "Netherlands",
  "Schweiz": "Switzerland",
  "Griechenland": "Greece",
  "Italien": "Italy",
  "Türkei": "Turkey",
  "England": "United Kingdom",
  "Schweden": "Sweden",
  "Vatikan": "Vatican",
  "Vereinigte Arabische Emirate": "United Arab Emirates",
  "Dänemark": "Denmark",
  "Luxemburg": "Luxembourg",
  "Österreich": "Austria",
  "Belgien": "Belgium",
  "Malta": "Malta",
  "Gibraltar": "Gibraltar",
  "Marokko": "Morocco",
  "Ungarn": "Hungary",
  "Portugal": "Portugal",
  "Norwegen": "Norway",
  "Litauen": "Lithuania",
  "USA": "United States of America",
  "Slowakei": "Slovakia",
  "Mauritius": "Mauritius",
  "Lettland": "Latvia"
};

// --- Farbskala ---
function getColor(v) {
  return v >= 100 ? '#08306b' :
         v >= 8 ? '#08519c' :
         v >= 5 ? '#3182bd' :
         v >= 3 ? '#6baed6' :
         v >= 2 ? '#9ecae1' :
         v >= 1 ? '#c6dbef' :
                  '#f2f2f2';
}

// --- Karte ---
const map = L.map('map', {minZoom: 2}).setView([30, 10], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// --- GeoJSON laden ---
fetch("https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson")
  .then(res => res.json())
  .then(data => {
    const notFound = [];
    L.geoJSON(data, {
      style: feature => {
        const adminName = feature.properties.ADMIN;
        const germanName = Object.keys(nameMap).find(de => nameMap[de] === adminName);
        const visits = germanName ? countryVisits[germanName] : 0;
        if (!germanName) notFound.push(adminName);
        return {
          fillColor: getColor(visits),
          color: "#666",
          weight: 0.6,
          fillOpacity: 0.9
        };
      },
      onEachFeature: (feature, layer) => {
        const adminName = feature.properties.ADMIN;
        const germanName = Object.keys(nameMap).find(de => nameMap[de] === adminName);
        const visits = germanName ? countryVisits[germanName] : 0;
        if (germanName && visits > 0) {
          layer.bindPopup(`<b>${germanName}</b><br>Besuche: ${visits >= 100 ? "♾️" : visits}`);
        }
      }
    }).addTo(map);

    console.log("Nicht gematchte Länder:", [...new Set(notFound)].sort());
  });

// --- Legende ---
const legend = L.control({position:'bottomleft'});
legend.onAdd = function(map){
  const div=L.DomUtil.create('div','legend');
  const grades=[1,2,3,5,8,100];
  const labels=['1','2','3','5+','8+','♾️'];
  for(let i=0;i<grades.length;i++){
    div.innerHTML+='<div><i style="background:'+getColor(grades[i])+';width:15px;height:15px;display:inline-block;margin-right:5px;"></i>'+labels[i]+'</div>';
  }
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
