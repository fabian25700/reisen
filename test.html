<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Meine Reisekarte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
  html,body {margin:0;height:100%;background:#f8f9fa;}
  #map {height:100vh;width:100vw;}
  .legend {background:white;padding:8px;border-radius:6px;font-size:13px;line-height:1.4;}
  .legend div {margin-bottom:4px;}
</style>
</head>
<body>
<div id="map"></div>

<script>
// --- Besuchsdaten (deutsche Namen) ---
const countryVisits = {
  "Deutschland": 10,
  "Spanien": 6,
  "Frankreich": 5,
  "Niederlande": 5,
  "Schweiz": 4,
  "Griechenland": 4,
  "Italien": 4,
  "Türkei": 3,
  "England": 3,
  "Schweden": 3,
  "Vatikan": 2,
  "Vereinigte Arabische Emirate": 2,
  "Dänemark": 2,
  "Luxemburg": 1,
  "Österreich": 1,
  "Belgien": 1,
  "Malta": 1,
  "Gibraltar": 1,
  "Marokko": 1,
  "Ungarn": 1,
  "Portugal": 1,
  "Norwegen": 1,
  "Litauen": 1,
  "USA": 1,
  "Slowakei": 1,
  "Mauritius": 1,
  "Lettland": 1
};

// --- Mapping von deutschen zu englischen GeoJSON-Namen ---
const nameMap = {
  "Deutschland": "Germany",
  "Spanien": "Spain",
  "Frankreich": "France",
  "Niederlande": "Netherlands",
  "Schweiz": "Switzerland",
  "Griechenland": "Greece",
  "Italien": "Italy",
  "Türkei": "Turkey",
  "England": "United Kingdom",
  "Schweden": "Sweden",
  "Vatikan": "Vatican",
  "Vereinigte Arabische Emirate": "United Arab Emirates",
  "Dänemark": "Denmark",
  "Luxemburg": "Luxembourg",
  "Österreich": "Austria",
  "Belgien": "Belgium",
  "Malta": "Malta",
  "Gibraltar": "Gibraltar",
  "Marokko": "Morocco",
  "Ungarn": "Hungary",
  "Portugal": "Portugal",
  "Norwegen": "Norway",
  "Litauen": "Lithuania",
  "USA": "United States",
  "Slowakei": "Slovakia",
  "Mauritius": "Mauritius",
  "Lettland": "Latvia"
};

// --- Farbskala ---
function getColor(v) {
  return v >= 8 ? '#084081' :
         v >= 5 ? '#0868ac' :
         v >= 4 ? '#2b8cbe' :
         v >= 3 ? '#4eb3d3' :
         v >= 2 ? '#7bccc4' :
         v >= 1 ? '#bae4bc' :
                  '#f0f0f0';
}

// --- Karte initialisieren ---
const map = L.map('map', { minZoom: 2 }).setView([30, 10], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// --- GeoJSON laden und einfärben ---
fetch("https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson")
  .then(res => res.json())
  .then(data => {
    L.geoJSON(data, {
      style: feature => {
        const countryName = feature.properties.ADMIN;
        const germanMatch = Object.keys(nameMap).find(de => nameMap[de] === countryName);
        const visits = germanMatch ? countryVisits[germanMatch] : 0;
        return {
          fillColor: getColor(visits || 0),
          weight: 0.6,
          opacity: 1,
          color: '#444',
          fillOpacity: 0.9
        };
      },
      onEachFeature: (feature, layer) => {
        const countryName = feature.properties.ADMIN;
        const germanMatch = Object.keys(nameMap).find(de => nameMap[de] === countryName);
        if (germanMatch) {
          const visits = countryVisits[germanMatch];
          layer.bindPopup(`<b>${germanMatch}</b><br>Besuche: ${visits >= 10 ? "♾️" : visits}`);
        }
      }
    }).addTo(map);
  });

// --- Legende ---
const legend = L.control({position: 'bottomleft'});
legend.onAdd = function (map) {
  const div = L.DomUtil.create('div', 'legend');
  const grades = [1,2,3,4,5,8];
  const labels = ['1','2','3','4+','5+','8+'];
  for (let i = 0; i < grades.length; i++) {
    div.innerHTML +=
      '<div><i style="background:' + getColor(grades[i]) + ';width:15px;height:15px;display:inline-block;margin-right:5px;"></i>' +
      labels[i] + '</div>';
  }
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
