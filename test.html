<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Meine bereisten Länder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;}
  #map{height:100vh;width:100vw;}
</style>
</head>
<body>
<div id="map"></div>

<script>
// Länder, die du besucht hast (deutsche Namen)
const visitedCountries = [
  "Deutschland","Spanien","Frankreich","Niederlande","Schweiz","Griechenland",
  "Italien","Türkei","England","Schweden","Vatikan","Vereinigte Arabische Emirate",
  "Dänemark","Luxemburg","Österreich","Belgien","Malta","Gibraltar","Marokko",
  "Ungarn","Portugal","Norwegen","Litauen","USA","Slowakei","Mauritius","Lettland"
];

// Mapping Deutsch → Englisch (GeoJSON-Namen)
const nameMap = {
  "Deutschland": "Germany",
  "Spanien": "Spain",
  "Frankreich": "France",
  "Niederlande": "Netherlands",
  "Schweiz": "Switzerland",
  "Griechenland": "Greece",
  "Italien": "Italy",
  "Türkei": "Turkey",
  "England": "United Kingdom",
  "Schweden": "Sweden",
  "Vatikan": "Vatican",
  "Vereinigte Arabische Emirate": "United Arab Emirates",
  "Dänemark": "Denmark",
  "Luxemburg": "Luxembourg",
  "Österreich": "Austria",
  "Belgien": "Belgium",
  "Malta": "Malta",
  "Gibraltar": "Gibraltar",
  "Marokko": "Morocco",
  "Ungarn": "Hungary",
  "Portugal": "Portugal",
  "Norwegen": "Norway",
  "Litauen": "Lithuania",
  "USA": "United States of America",
  "Slowakei": "Slovakia",
  "Mauritius": "Mauritius",
  "Lettland": "Latvia"
};

// Karte erstellen
const map = L.map('map', {minZoom: 2}).setView([30, 10], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// GeoJSON laden und einfärben
fetch("https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson")
  .then(res => res.json())
  .then(data => {
    L.geoJSON(data, {
      style: feature => {
        const admin = feature.properties.ADMIN;
        const isVisited = Object.keys(nameMap).some(de => nameMap[de] === admin && visitedCountries.includes(de));
        return {
          fillColor: isVisited ? '#009933' : '#ffcccc',
          color: '#333',
          weight: 0.3,
          fillOpacity: 0.9
        };
      },
      onEachFeature: (feature, layer) => {
        const admin = feature.properties.ADMIN;
        const german = Object.keys(nameMap).find(de => nameMap[de] === admin);
        if (german && visitedCountries.includes(german)) {
          layer.bindPopup(`<b>${german}</b><br>✅ besucht`);
        } else if (german) {
          layer.bindPopup(`<b>${german}</b><br>❌ nicht besucht`);
        } else {
          layer.bindPopup(`${admin}`);
        }
      }
    }).addTo(map);
  });
</script>
</body>
</html>
