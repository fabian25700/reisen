<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Meine Reisekarte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
  html,body {margin:0;height:100%;background:#f8f9fa;}
  #map {height:100vh;width:100vw;}
  .legend {background:white;padding:8px;border-radius:6px;font-size:13px;line-height:1.4;}
  .legend div {margin-bottom:4px;}
</style>
</head>
<body>
<div id="map"></div>

<script>
// --- Länderdaten (Häufigkeitsskala) ---
const countryVisits = {
  "Germany": 10,
  "Spain": 6,
  "France": 5,
  "Netherlands": 9,
  "Switzerland": 4,
  "Greece": 4,
  "Italy": 4,
  "Turkey": 3,
  "England": 3,
  "Sweden": 3,
  "Vatican": 2,
  "United Arab Emirates": 2,
  "Denmark": 2,
  "Luxembourg": 1,
  "Austria": 3,
  "Belgium": 8,
  "Malta": 1,
  "Gibraltar": 1,
  "Morocco": 1,
  "Hungary": 1,
  "Portugal": 1,
  "Norway": 1,
  "Lithuania": 1,
  "United States": 1,
  "Slovakia": 1,
  "Mauritius": 1,
  "Latvia": 1
};

// --- Farbskala ---
function getColor(v) {
  return v >= 8 ? '#084081' :
         v >= 5 ? '#0868ac' :
         v >= 4 ? '#2b8cbe' :
         v >= 3 ? '#4eb3d3' :
         v >= 2 ? '#7bccc4' :
         v >= 1 ? '#bae4bc' :
                  '#f0f0f0';
}

// --- Karte initialisieren ---
const map = L.map('map', { minZoom: 2 }).setView([30, 10], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// --- GeoJSON der Welt laden ---
fetch("https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson")
  .then(res => res.json())
  .then(data => {
    L.geoJSON(data, {
      style: feature => ({
        fillColor: getColor(countryVisits[feature.properties.ADMIN] || 0),
        weight: 0.8,
        opacity: 1,
        color: '#555',
        fillOpacity: 0.85
      }),
      onEachFeature: (feature, layer) => {
        const name = feature.properties.ADMIN;
        const v = countryVisits[name] || 0;
        if (v > 0) {
          layer.bindPopup(`<b>${name}</b><br>Besuche: ${v >= 10 ? "♾️" : v}`);
        }
      }
    }).addTo(map);
  });

// --- Legende ---
const legend = L.control({position: 'bottomleft'});
legend.onAdd = function (map) {
  const div = L.DomUtil.create('div', 'legend');
  const grades = [1,2,3,4,5,8];
  const labels = ['1','2','3','4+','5+','8+'];
  for (let i = 0; i < grades.length; i++) {
    div.innerHTML +=
      '<div><i style="background:' + getColor(grades[i]) + ';width:15px;height:15px;display:inline-block;margin-right:5px;"></i>' +
      labels[i] + '</div>';
  }
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
